<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Polychoron</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body { margin: 0; height: 100%; background: #0c0d12; overflow: hidden; overscroll-behavior: none; }
  #offline { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #8b9096;

</style>

<body>
<div id="offline">connect to the internet once<br>so this can be saved for offline use</div>
<script>
  if (typeof p5 === 'undefined') document.getElementById('offline').style.display = 'block';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
<script src="polychoron.js"></script>
</body>
